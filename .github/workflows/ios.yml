name: iOS

# Baut und testet die iOS-App. Der plattformunabhängige Kern läuft zuerst auf Linux (günstig);
# nur wenn er grün ist, startet der macOS-Runner für App, Simulator-Screenshots und .ipa.
# Ein Tag ios-v<Version> legt zusätzlich einen Release-Entwurf mit EasyBooks-ios-<Version>.ipa an.
on:
  push:
    branches: [main, ios-port]
    tags: ["ios-v*"]
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  core:
    name: Kern (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        run: swift test --package-path ios/EasyBooksCore

  app:
    name: App (macOS)
    needs: core
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag passt zur App-Version
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          MARKETING=$(grep -E '^ *MARKETING_VERSION:' ios/project.yml | cut -d'"' -f2)
          if [ "$VERSION" != "$MARKETING" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu MARKETING_VERSION $MARKETING in ios/project.yml"
            exit 1
          fi

      - name: Xcode und XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate

      - name: Simulator wählen
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devs in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  name = d["name"]
                  if name.startswith("iPhone") and "Pro" in name and "Max" not in name:
                      key = (runtime, name)
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1])
          ')
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: App für den Simulator bauen
        run: |
          xcodebuild -project ios/EasyBooks.xcodeproj -scheme EasyBooks -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Screenshots mit den Beispielbüchern
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/sim/Build/Products/Release-iphonesimulator/EasyBooks.app
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          DATA=$(xcrun simctl get_app_container "$UDID" com.example.ebf data)
          mkdir -p "$DATA/Documents"
          cp -R shared/samples/. "$DATA/Documents/"
          mkdir -p shots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.example.ebf || true
            xcrun simctl launch "$UDID" com.example.ebf "$@"
            sleep 12
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot library -theme light -textSize normal
          shot reading -theme light -textSize normal -demoOpen Leuchtturm -demoPage 2 -demoHideBars YES
          shot large -theme light -textSize large -demoOpen Nordlicht -demoPage 2 -demoHideBars YES
          shot small -theme light -textSize small -demoOpen Nordlicht -demoPage 2
          shot dark -theme dark -textSize normal -demoOpen Leuchtturm -demoPage 2 -demoHideBars YES
          shot library-dark -theme dark -textSize normal
          shot settings -theme light -textSize normal -demoSettings YES
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "EasyBooks"' --style compact > shots/log.txt || true

      - name: Unsignierte .ipa bauen
        run: |
          xcodebuild -project ios/EasyBooks.xcodeproj -scheme EasyBooks -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build -quiet
          mkdir -p ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/EasyBooks.app ipa/Payload/
          (cd ipa && zip -qry ../EasyBooks.ipa Payload)
          ls -la EasyBooks.ipa

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: .ipa hochladen
        uses: actions/upload-artifact@v4
        with:
          name: EasyBooks-ipa
          path: EasyBooks.ipa

      - name: Release-Entwurf mit .ipa
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          cp EasyBooks.ipa "EasyBooks-ios-$VERSION.ipa"
          gh release create "$GITHUB_REF_NAME" "EasyBooks-ios-$VERSION.ipa" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease --latest=false \
            --title "Easy Books for iPhone $VERSION" \
            --notes "Release notes follow."
