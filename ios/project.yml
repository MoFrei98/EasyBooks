# Xcode-Projekt für die iOS-App, erzeugt mit XcodeGen:  cd ios && xcodegen
name: EasyBooks
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: NO

packages:
  EasyBooksCore:
    path: EasyBooksCore

targets:
  EasyBooks:
    type: application
    platform: iOS
    sources:
      - path: EasyBooks
      # Dieselben Umblätter-Geräusche wie in der Android-App.
      - path: ../app/src/main/res/raw
        buildPhase: resources
        group: Sounds
    dependencies:
      - package: EasyBooksCore
    scheme: {}
    settings:
      base:
        # Stammt noch aus der Zeit, als die App "EBF" hieß. Nicht ändern: iOS erkennt neue
        # Versionen nur mit derselben Bundle-ID als Update, sonst sind Bibliothek, Lesefortschritt
        # und Einstellungen der installierten App weg.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ebf
        PRODUCT_NAME: EasyBooks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: EasyBooks/Info.plist
    info:
      path: EasyBooks/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        CFBundleDisplayName: Easy Books
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Der Bibliotheksordner erscheint in der Dateien-App unter "Auf meinem iPhone › Easy Books" (Anzeigename der App).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # "Öffnen mit" / Teilen für PDFs
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
